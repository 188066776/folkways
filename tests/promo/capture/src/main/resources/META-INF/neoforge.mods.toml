modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways Capture Fixture"
description = "A test-only fixture that lets NeoForge read the real OpenGL version from Blockwright's active offscreen render context."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "folkways-capture.mixins.json"
