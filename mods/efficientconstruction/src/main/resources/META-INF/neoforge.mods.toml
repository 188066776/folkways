modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways: Efficient Construction"
displayURL = "https://github.com/IzakyL/folkways"
description = "An optional extension to Folkways' building work: a site raises itself at a steady pace while the residents who come only carry the materials and keep it going. Not a mod integration, and nothing changes without this jar installed."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "The colony engine and screens this extension builds on."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
reason = "The building work this extension changes. It must be the build that carries the efficient-construction seam."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"
