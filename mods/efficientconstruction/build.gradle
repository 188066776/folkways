plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_efficient_construction"
ext.modName = "folkways-efficient-construction"
apply from: rootProject.file("gradle/mod.gradle")
evaluationDependsOn(":core")
evaluationDependsOn(":vanilla")

// A functional extension, not an integration: it reads nothing outside Folkways and adds no blocks of its own.
dependencies {
    api project(":vanilla")

    gametestImplementation project(":core").sourceSets.gameTestFixtures.output
}
