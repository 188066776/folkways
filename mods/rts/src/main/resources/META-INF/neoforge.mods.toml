modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways RTS"
displayURL = "https://github.com/IzakyL/folkways"
description = "Optional resident commands, squads and real-time controls for Folkways."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "Folkways RTS uses the colony engine and resident access supplied by Folkways Core."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
reason = "Folkways RTS uses Vanilla's resident, defense and weapon APIs."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"
